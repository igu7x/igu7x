<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Igor Cupertino — Desenvolvedor de Software">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 150) scale(360 260)">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 280) scale(300 200)">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dfe7ff"/>
      <stop offset="1" stop-color="#8fa9ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .label { font: 600 14px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: 3px; fill: #7c9cff; }
      .name  { font: 700 68px "Segoe UI", Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -2px; }
      .sub   { font: 400 20px "Segoe UI", Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #9aa4b8; }
      .chip  { font: 500 13px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #c9d3ea; }
      .edge  { stroke: #7c9cff; stroke-opacity: 0.22; stroke-width: 1; }
      .node  { fill: #0b0f19; stroke: #7c9cff; stroke-width: 1.5; }
      .pulse { fill: #9db4ff; animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: .6s } .p3 { animation-delay: 1.2s } .p4 { animation-delay: 1.8s } .p5 { animation-delay: 2.4s }
      .flow  { stroke: url(#line); stroke-width: 1.5; fill: none; stroke-dasharray: 6 220; animation: flow 4s linear infinite; }
      .f2 { animation-delay: 1.3s } .f3 { animation-delay: 2.6s }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
      @keyframes flow { from { stroke-dashoffset: 226 } to { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0a0d14"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- rede neural -->
    <g transform="translate(820 60)">
      <g class="edge">
        <line x1="0" y1="40" x2="140" y2="0"/><line x1="0" y1="40" x2="140" y2="100"/><line x1="0" y1="40" x2="140" y2="200"/>
        <line x1="0" y1="160" x2="140" y2="0"/><line x1="0" y1="160" x2="140" y2="100"/><line x1="0" y1="160" x2="140" y2="200"/>
        <line x1="140" y1="0" x2="280" y2="60"/><line x1="140" y1="0" x2="280" y2="140"/>
        <line x1="140" y1="100" x2="280" y2="60"/><line x1="140" y1="100" x2="280" y2="140"/>
        <line x1="140" y1="200" x2="280" y2="60"/><line x1="140" y1="200" x2="280" y2="140"/>
      </g>
      <path class="flow" d="M0 40 L140 100 L280 60"/>
      <path class="flow f2" d="M0 160 L140 0 L280 140"/>
      <path class="flow f3" d="M0 40 L140 200 L280 140"/>
      <circle class="node" cx="0" cy="40" r="9"/><circle class="node" cx="0" cy="160" r="9"/>
      <circle class="node" cx="140" cy="0" r="9"/><circle class="node" cx="140" cy="100" r="9"/><circle class="node" cx="140" cy="200" r="9"/>
      <circle class="node" cx="280" cy="60" r="9"/><circle class="node" cx="280" cy="140" r="9"/>
      <circle class="pulse" cx="0" cy="40" r="3.5"/><circle class="pulse p2" cx="140" cy="100" r="3.5"/>
      <circle class="pulse p3" cx="280" cy="60" r="3.5"/><circle class="pulse p4" cx="0" cy="160" r="3.5"/>
      <circle class="pulse p5" cx="140" cy="200" r="3.5"/><circle class="pulse p3" cx="140" cy="0" r="3.5"/>
      <circle class="pulse p2" cx="280" cy="140" r="3.5"/>
    </g>

    <!-- texto -->
    <text x="72" y="100" class="label">// SOFTWARE DEVELOPER</text>
    <text x="68" y="172" class="name" fill="url(#name)">Igor Cupertino</text>
    <rect x="72" y="202" width="64" height="3" rx="1.5" fill="url(#line)"/>
    <text x="72" y="240" class="sub">Criando soluções digitais · Inteligência Artificial</text>

    <g transform="translate(72 264)">
      <rect width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="33" y="19" class="chip" text-anchor="middle">Java</text>
      <rect x="76" width="78" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="115" y="19" class="chip" text-anchor="middle">Spring</text>
      <rect x="164" width="72" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="200" y="19" class="chip" text-anchor="middle">React</text>
      <rect x="246" width="112" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="302" y="19" class="chip" text-anchor="middle">TypeScript</text>
      <rect x="368" width="48" height="28" rx="14" fill="#7c9cff" fill-opacity="0.12" stroke="#7c9cff" stroke-opacity="0.35"/>
      <text x="392" y="19" class="chip" text-anchor="middle" style="fill:#b9c8ff">IA</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="url(#border)"/>
</svg>
